<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>CS208 - JavaScript in the Browser</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Starting Lineup</h1>
  <form>
    
    <p>
      <fieldset>
        <ledgend>Status</ledgend>
        <input type="radio" name="status" value="draft" id="draft">
        <label for="draft">Draft</label>

        <input type="radio" name="status" value="final" id="final" checked>
        <label for="final">Final</label>
      </fieldset>
    </p>

    <p>
      Date: 
      <select name="gameDate">
        <option value="march20">March 20</option>
        <option value="march24">March 24</option>
        <option value="april2">April 2</option>
        <option value="april6">April 6</option>
        <option value="april13">April 13</option>
      </select>
    </p>

    <p>
      <fieldset>
        <ledgend>Players:</ledgend>
        <input type="checkbox" name="aa" id="aa">
        <label for="aa">Aarav Agarwal</label>
  
        <input type="checkbox" name="aj" id="aj">
        <label for="aj">Ava Johnson</label>
  
        <input type="checkbox" name="jo" id="jo">
        <label for="jo">Julio Ortiz</label>
  
        <input type="checkbox" name="lr" id="lr">
        <label for="lr">Liam Rubio</label>
  
        <input type="checkbox" name="ew" id="ew">
        <label for="ew">Emma WitherSpoon</label>
      </fieldset>
    </p>

    <button>Submit</button>
  </form>
</body>

</html>
